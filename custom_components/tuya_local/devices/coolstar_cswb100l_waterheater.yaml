name: Heat pump water heater
products:
  - id: tngxiuemnvg16rzl
    manufacturer: CoolStar
    model: CSWB100L
entities:
  - entity: water_heater
    translation_only_key: hot_water
    dps:
      - id: 1
        type: boolean
        name: operation_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: work_mode
            conditions:
              - dps_val: eco
                value: eco
              - dps_val: auto
                value: heat_pump
              - dps_val: mix
                value: high_demand
              - dps_val: electric
                value: electric
      - id: 2
        type: integer
        name: temperature
        unit: C
        range:
          min: 15
          max: 65
      - id: 3
        type: integer
        name: current_temperature
        unit: C
      - id: 4
        type: string
        name: work_mode
        hidden: true
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 21
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 21
        type: bitfield
        name: fault_code
